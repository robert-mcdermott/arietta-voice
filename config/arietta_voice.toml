[admin]
allow_source_editing = false

[assistant]
name = "Bridget"
identity = "I'm Bridget, a local voice-first assistant built with Arietta Voice. I can answer questions from my local knowledge base, use tools, and optionally route chat turns through AWS Bedrock."
greeting_variants = [
  "Yes?",
  "I'm here.",
  "How can I help?",
]
goodbye_variants = [
  "Goodbye.",
  "See you later.",
  "Talk to you soon.",
]
max_history_turns = 8

[wake_word]
enabled = true
backend = "transcript"
phrases = ["bridget"]
acknowledgement = "Yes?"
session_timeout_s = 20.0
allow_inline_commands = true

[audio]
# Empty = OS default when connecting. Use an exact name or HOST::NAME from `devices`.
# Store personal selections in arietta_voice.local.toml; indices are not stable.
input_device = ""
output_device = ""
# Recover after callback stalls or sleep/scheduling gaps; retry backs off to 30 s.
device_stall_s = 3.0
reconnect_delay_s = 1.0
sample_rate = 16000
chunk_samples = 512
silence_ms = 700
# With Smart Turn on, the end of a turn is also checked after endpoint_early_ms of
# silence, and work on the answer starts at once when the model is at least this
# confident. The assistant keeps listening until silence_ms has passed and starts
# over with the whole utterance if you carry on. Set endpoint_early_ms = 0 to wait
# for silence_ms every time.
endpoint_early_ms = 250.0
endpoint_early_threshold = 0.7
tts_enabled = true
# "mlx" is faster but optional: uv sync --group mlx-speech, then set mlx_kokoro_model.
tts_backend = "onnx"
# For MLX: explicit local Kokoro directory; relative paths resolve beside this config.
mlx_kokoro_model = ""
# Cut the silence each synthesised clip starts and ends with to 40 ms and 100 ms.
# MLX pads clips with about 0.3 s before and 0.4 s after, which delays the first
# word and leaves long pauses between clauses.
tts_trim_silence = true
smart_turn_enabled = true
aec_enabled = true
chime_enabled = true
voice = "af_heart"
tts_speed = 1.0
barge_in_threshold_chunks = 5
# Drop oldest queued input under load; discard incomplete/oversized utterances.
queue_max_chunks = 64
max_utterance_s = 30.0
# --record streams to disk; these cap queued chunks and total saved duration.
recording_queue_max_chunks = 256
max_recording_s = 3600.0
playback_reference_s = 4.0
# Listening pre-roll; barge-in pre-roll rounds up to a 32 ms capture chunk.
pre_roll_ms = 200.0
# Extra acoustic/device delay after the reported output latency; tune only with measurements.
aec_delay_ms = 0.0

[runtime]
# Shared STT + chat/tools + speech + optional memory budget for each voice turn.
turn_timeout_s = 60.0
endpoint_timeout_s = 5.0
startup_timeout_s = 300.0

[models]
chat_provider = "local"
chat_model = "mlx-community/gemma-4-E4B-it-4bit"
bedrock_region = ""
bedrock_profile = ""
aws_access_key_id = ""
aws_secret_access_key = ""
aws_session_token = ""
stt_language = "en"
# Local model only: reuse the already-processed start of each conversation prompt
# (persona, tool instructions, earlier turns) so the first word arrives sooner.
reuse_prompt_prefix = true
# Local model only: offer tools through Gemma's own tool-calling format. It picks
# the right tool far more often than the prompted JSON used with Bedrock.
native_tool_calls = true
temperature = 0.7
max_tokens = 220

[prompts]
soul_path = "SOUL.md"
memory_path = "MEMORY.md"

[memory]
enabled = false
consolidate_every_turns = 5

[logging]
directory = "../logs"
events_file = "../logs/events.jsonl"
# Active conversation text is omitted from logs and runtime status by default.
content_enabled = false
max_bytes = 5000000
backup_count = 3

[knowledge]
enabled = true
backend = "keyword"
directory = "../knowledge"
index_directory = "../.knowledge_index"
embedding_model = "BAAI/bge-small-en-v1.5"
max_matches = 3
snippet_char_limit = 420
min_score = 6.0
hybrid_alpha = 0.55
min_vector_score = 0.3

[tools]
# Built-in tools, then any of your own. Requests are checked against each tool's
# trigger phrases in this order, so keep search_knowledge (which matches
# everything) after tools that answer instantly.
enabled = [
  "assistant_identity",
  "local_time",
  "set_timer",
  "set_reminder",
  "set_alarm",
  "check_timers",
  "cancel_timer",
  "calculate",
  "date_math",
  "search_knowledge",
  "system_info",
]
# Your own tools: one Python file per tool. See tools/README.md.
directory = "../tools"

[timers]
# Timers and reminders are kept here, so they survive a restart. Private: not
# tracked by Git. Relative paths resolve beside this config.
path = "../state/timers.json"
# One that goes off is said again this often until you answer it ("stop",
# "okay", "snooze" or any request), at most max_repeats more times.
repeat_s = 30.0
max_repeats = 4
# "Snooze" on its own waits this long.
snooze_minutes = 5.0
# A short tone before the announcement.
alert_tone = true
